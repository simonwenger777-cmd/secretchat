<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Калькулятор окупаемости</title>
<style>
:root{--bg:#0a0a0a;--card:#111;--line:#262626;--txt:#fafafa;--mut:#7a7a7a;--e:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#1c1c1c,var(--bg) 60%);color:var(--txt);min-height:100vh;padding:32px 16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;display:grid;grid-template-columns:420px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr;max-width:460px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px 28px;box-shadow:0 30px 80px #000c;animation:in .7s var(--e) both}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}
@keyframes in{from{opacity:0;transform:translateY(20px) scale(.98)}}
h1,h2{font-size:13px;font-weight:500;letter-spacing:.25em;text-transform:uppercase}
p.sub{color:var(--mut);font-size:12px;margin:8px 0 26px}
label{display:block;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--mut);margin-bottom:4px;transition:color .25s}
.f{position:relative;margin-bottom:20px}
.f:focus-within label{color:var(--txt)}
input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 34px 8px 0;color:var(--txt);font-family:inherit;font-size:22px;font-weight:300;line-height:1.2;outline:none;font-variant-numeric:tabular-nums}
input.t{font-size:16px;font-weight:400}
input::placeholder{color:#3a3a3a}
.f::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--txt);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--e)}
.f:focus-within::after{transform:scaleX(1)}
.f span{position:absolute;right:0;bottom:11px;color:var(--mut);font-size:14px}
.row{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.seg{position:absolute;right:0;bottom:7px;display:flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{all:unset;cursor:pointer;font-size:12px;padding:3px 9px;border-radius:999px;color:var(--mut);transition:.25s}
.seg button.on{background:var(--txt);color:#0a0a0a}
.rate{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:24px;font-size:13px;color:var(--mut)}
.rate input{font-size:16px;padding:2px 0;border:0;width:70px;flex:none;text-align:right}
.rate .lnk{margin-left:auto}
.lnk{all:unset;cursor:pointer;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);transition:color .2s}
.lnk:hover{color:var(--txt)}
.conv{font-size:12px;color:var(--mut);margin:-12px 0 18px;min-height:14px;transition:opacity .3s}
.res{padding:24px 18px 20px;border-radius:18px;background:var(--txt);color:#0a0a0a;text-align:center;transition:background .4s,color .4s}
.res.bad{background:transparent;color:var(--txt);outline:1px dashed #555}
.res small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.55}
.big{font-size:40px;font-weight:200;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid #0000001f;padding-top:14px}
.bad .stats{border-color:#ffffff1f}
.stats div+div{border-left:1px solid #0000001f}.bad .stats div+div{border-color:#ffffff1f}
.stats b{display:block;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.stats i{font-style:normal;font-size:10px;letter-spacing:.15em;text-transform:uppercase;opacity:.5}
.btns{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:18px}
.btn{padding:14px 18px;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:999px;cursor:pointer;font-size:11px;letter-spacing:.2em;text-transform:uppercase;transition:.25s}
.btn:hover{color:var(--txt);border-color:#555}
.btn.pri{background:var(--txt);color:#0a0a0a;border-color:var(--txt)}
.btn.pri:hover{background:#ddd}
.btn:active{transform:scale(.98)}
.head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.list{display:flex;flex-direction:column}
.empty{color:#444;font-size:13px;text-align:center;padding:40px 0;border:1px dashed var(--line);border-radius:14px}
.it{display:grid;grid-template-columns:22px 1fr auto 24px;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);animation:row .45s var(--e);transition:opacity .3s,background .2s}
.it:hover{background:#ffffff05}
.it.off{opacity:.35}
.it.out{animation:outr .3s var(--e) forwards}
@keyframes row{from{opacity:0;transform:translateX(-10px)}}
@keyframes outr{to{opacity:0;transform:translateX(20px);height:0;padding:0}}
.chk{appearance:none;width:18px;height:18px;border:1px solid #555;border-radius:5px;cursor:pointer;display:grid;place-items:center;transition:.2s;margin:0}
.chk:checked{background:var(--txt);border-color:var(--txt)}
.chk:checked::after{content:"";width:5px;height:9px;border:solid #0a0a0a;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.nm{font-size:14px;cursor:pointer}.nm div{font-size:11px;color:var(--mut);margin-top:3px;font-variant-numeric:tabular-nums}
.pr{text-align:right;font-variant-numeric:tabular-nums;font-size:15px}.pr div{font-size:11px;color:var(--mut);margin-top:3px}
.del{all:unset;cursor:pointer;color:#444;font-size:18px;text-align:center;transition:color .2s}.del:hover{color:var(--txt)}
.tot{margin-top:20px;padding:22px;border:1px solid var(--line);border-radius:18px}
.tot .g{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 12px}
.tot i{display:block;font-style:normal;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.tot b{font-size:18px;font-weight:400;font-variant-numeric:tabular-nums}
.tot .main{grid-column:1/-1;padding-bottom:14px;border-bottom:1px solid var(--line)}
.tot .main b{font-size:34px;font-weight:200}
.acts{display:flex;gap:18px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--txt);color:#0a0a0a;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.35s var(--e);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ai{grid-column:1/-1}
.ai .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.ai .box{display:flex;gap:10px;align-items:flex-end;border:1px solid var(--line);border-radius:18px;padding:12px 12px 12px 16px;transition:border-color .3s}
.ai .box:focus-within{border-color:#555}
.ai textarea{flex:1;background:transparent;border:0;outline:none;color:var(--txt);font-family:inherit;font-size:15px;line-height:1.5;resize:none;min-height:24px;max-height:160px}
.ai textarea::placeholder{color:#444}
.ib{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;transition:.25s;font-size:16px}
.ib.send{background:var(--txt);color:#0a0a0a}.ib.send:hover{background:#ddd}
.ib.mic{border:1px solid var(--line);color:var(--mut)}.ib.mic:hover,.ib.mic.on{color:var(--txt);border-color:var(--txt)}
.ib.mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #ffffff14}}
.ib:disabled{opacity:.4;pointer-events:none}
.ai .msg{font-size:12px;color:var(--mut);margin-top:10px;min-height:16px;transition:opacity .3s}
.ai.busy .send{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.keyrow{display:none;gap:10px;margin-top:14px;align-items:center}
.keyrow.on{display:flex;animation:in .4s var(--e)}
.keyrow input{font-size:14px;padding:8px 0;flex:1}
.keyrow select{background:#111;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px}
.hints{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hint{all:unset;cursor:pointer;font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:6px 12px;transition:.2s}
.hint:hover{color:var(--txt);border-color:#555}
.it.new{animation:row .45s var(--e),flash 1.4s}
@keyframes flash{0%,40%{background:#ffffff14}}

/* ===== compact ===== */
body{padding:16px 12px}
.wrap{max-width:860px;grid-template-columns:360px 1fr;gap:12px}
@media(max-width:820px){.wrap{grid-template-columns:1fr;max-width:420px}}
.card{border-radius:18px;padding:18px 18px}
h1,h2{font-size:11px;letter-spacing:.22em}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.rate{margin:0;padding:5px 10px;gap:6px;border-radius:999px;font-size:12px}
.rate input{width:56px;font-size:14px;text-align:center}
.rate .lnk{margin-left:4px}
.f{margin-bottom:12px}
label{font-size:10px;margin-bottom:2px}
input{font-size:18px;padding:6px 26px 6px 0}
input.t{font-size:14px}
.f span{bottom:8px;font-size:12px}
.row{grid-template-columns:1fr 1fr;gap:12px}
.row.r2{grid-template-columns:1fr 64px}
.seg{bottom:4px}.seg button{font-size:11px;padding:2px 7px}
.conv{margin:-6px 0 10px;font-size:11px;min-height:0}
.conv:empty{display:none}
.res{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:14px}
.res small{font-size:9px;grid-column:1;grid-row:1;align-self:start}
.big{font-size:26px;margin:14px 0 0;grid-column:1;grid-row:1}
.stats{margin:0;padding:0 0 0 14px;border-top:0;border-left:1px solid #0000001f;grid-row:1;grid-column:2;text-align:center}
.bad .stats{border-color:#ffffff1f}
.stats b{font-size:13px}.stats i{font-size:9px}
.btns{margin-top:12px;gap:8px}
.btn{padding:11px 14px;font-size:10px}
#reset{padding:8px 14px;display:grid;place-items:center}
.head{margin-bottom:8px}
.empty{padding:22px 0;font-size:12px}
.it{padding:9px 2px;gap:10px;grid-template-columns:18px 1fr auto 18px}
.chk{width:16px;height:16px;min-width:16px;padding:0;border:1px solid #555;font-size:0}
.nm{font-size:13px}.nm div{font-size:10px;margin-top:1px}
.pr{font-size:13px}.pr div{font-size:10px;margin-top:1px}
.list{max-height:46vh;overflow:auto;scrollbar-width:thin;scrollbar-color:#333 transparent}
.tot{margin-top:12px;padding:14px 16px;border-radius:14px}
.tot .g{grid-template-columns:repeat(4,1fr);gap:8px}
.tot .main{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:10px}
.tot .main i{margin:0}
.tot .main b{font-size:24px}
.tot b{font-size:14px}.tot i{font-size:9px;margin-bottom:2px}
#tMarginBig{display:none}
.acts{margin-top:10px;gap:14px}
.ai{padding:10px 10px 10px 14px}
.ai .box{border:0;padding:0;gap:8px;align-items:center}
.ai textarea{font-size:14px;overflow:hidden;height:22px;padding:0}
#keyBtn{font-size:16px;letter-spacing:0;padding:0 4px}
.ib{width:34px;height:34px;font-size:14px}
.ai .msg{margin:6px 0 0;font-size:11px;min-height:0}
.ai .msg:empty{display:none}
.hints{margin-top:8px;gap:6px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.hints::-webkit-scrollbar{display:none}
.hint{font-size:11px;padding:4px 10px;white-space:nowrap}
.ai:not(:focus-within) .hints{display:none}
.keyrow{margin-top:8px}
.toast{bottom:16px;font-size:12px;padding:8px 14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="wrap">
<div class="card ai" id="ai">
<div class="box"><button class="lnk" id="keyBtn" title="Ключ и модель">⚙</button><textarea id="prompt" rows="1" placeholder="ИИ: купил 10 наушников по 20$, продал по 3000…"></textarea>
<button class="ib mic" id="mic" title="Голосом" hidden>●</button><button class="ib send" id="send" title="Отправить (Enter)">↑</button></div>
<div class="keyrow" id="keyrow"><input id="key" type="password" placeholder="gsk_…" autocomplete="off"><select id="model"><option value="qwen/qwen3.8-27b">Qwen 3.8 27B · быстрая</option><option value="openai/gpt-oss-120b">GPT-OSS 120B · умнее</option><option value="openai/gpt-oss-20b">GPT-OSS 20B</option></select><button class="lnk" id="keySave">Сохранить</button></div>
<div class="hints" id="hints"><button class="hint">Курс 92,4</button><button class="hint">Чехлы закупил 50 шт за 300$, продаю по 900₽</button><button class="hint">Удали чехлы</button><button class="hint">Очисти список</button></div>
<div class="msg" id="msg"></div>
</div>
<div class="card">
<div class="hd"><h1>Окупаемость</h1><div class="rate">$<input id="rate" inputmode="decimal" placeholder="курс">₽<button class="lnk" id="cbr">ЦБ</button></div></div>
<div class="row r2"><div class="f"><label for="name">Товар</label><input id="name" class="t" placeholder="Название"></div>
<div class="f"><label for="qty">Шт</label><input id="qty" inputmode="numeric" placeholder="1"></div>
</div>
<div class="row">
<div class="f"><label for="sell">Продажа</label><input id="sell" inputmode="decimal" placeholder="0"><span>₽</span></div>
<div class="f"><label for="buy">Закуп</label><input id="buy" inputmode="decimal" placeholder="0" style="padding-right:62px"><div class="seg" id="cur"><button data-c="USD" class="on">$</button><button data-c="RUB">₽</button></div></div>
</div>
<div class="conv" id="conv"></div>
<div class="res" id="res"><small>Прибыль</small><div class="big" id="profit">0 ₽</div>
<div class="stats"><div><b id="margin">0%</b><i>Маржа</i></div><div><b id="markup">0%</b><i>Наценка</i></div><div><b id="unit">0 ₽</b><i>С 1 шт</i></div></div></div>
<div class="btns"><button class="btn pri" id="add">Добавить</button><button class="btn" id="reset" title="Сбросить"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button></div>
</div>
<div class="card">
<div class="head"><h2>Список</h2><span class="lnk" id="cnt" style="cursor:default"></span></div>
<div class="list" id="list"></div>
<div class="tot">
<div class="g"><div class="main"><i>Общая прибыль</i><b id="tProfit">0 ₽</b><span id="tMarginBig"></span></div>
<div><i>Выручка</i><b id="tSell">0 ₽</b></div><div><i>Закуп</i><b id="tBuy">0 ₽</b></div>
<div><i>Маржа</i><b id="tMargin">0%</b></div><div><i>Закуп в $</i><b id="tUsd">$0</b></div></div>
</div>
<div class="acts"><button class="lnk" id="copy">Скопировать</button><button class="lnk" id="clear">Очистить список</button></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id),F=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
const rub=v=>F.format(v)+' ₽',usd=v=>'$'+F.format(v);
const num=el=>{const v=parseFloat(String(el.value).replace(/\s/g,'').replace(',','.'));return isNaN(v)?0:v};
const S=JSON.parse(localStorage.getItem('calc2')||'{}');
let items=S.items||[],cur=S.cur||'USD',editId=null;
$('rate').value=S.rate||'';
const save=()=>localStorage.setItem('calc2',JSON.stringify({items,cur,rate:$('rate').value}));
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}
function tween(el,to,f){const from=el._v||0;let t0=null;cancelAnimationFrame(el._r);el._to=to;
 const st=t=>{if(t0===null)t0=t;const k=Math.min((t-t0)/380,1),v=k>=1?to:from+(to-from)*(1-Math.pow(1-k,3));el._v=v;el.textContent=f(v);if(k<1)el._r=requestAnimationFrame(st)};
 el._r=requestAnimationFrame(st);clearTimeout(el._s);el._s=setTimeout(()=>{if(el._v!==to){cancelAnimationFrame(el._r);el._v=to;el.textContent=f(to)}},600)}
function setCur(c){cur=c;document.querySelectorAll('#cur button').forEach(b=>b.classList.toggle('on',b.dataset.c===c));calc()}
function current(){const rate=num($('rate')),s=num($('sell')),bRaw=num($('buy')),q=num($('qty'))||1;
 const b=cur==='USD'?bRaw*rate:bRaw;return{rate,s,bRaw,b,q,u:s-b}}
function calc(){const c=current();
 tween($('profit'),c.u*c.q,rub);$('unit').textContent=rub(c.u);
 $('margin').textContent=c.s?F.format(c.u/c.s*100)+'%':'0%';$('markup').textContent=c.b?F.format(c.u/c.b*100)+'%':'0%';
 $('res').classList.toggle('bad',c.u<0);
 $('conv').textContent=cur==='USD'&&c.bRaw?(c.rate?`${usd(c.bRaw)} × ${F.format(c.rate)} = ${rub(c.b)}`:'Укажите курс доллара'):'';
 save()}
function render(){const L=$('list');
 L.innerHTML=items.length?'':'<div class="empty">Добавьте товары — итог посчитается здесь</div>';
 items.forEach(it=>{const b=it.cur==='USD'?it.buy*it.rate:it.buy,u=(it.sell-b)*it.qty,d=document.createElement('div');
  d.className='it'+(it.on?'':' off');d.innerHTML=`<input type="checkbox" class="chk" ${it.on?'checked':''}>
  <div class="nm">${esc(it.name||'Без названия')}<div>${it.qty} шт · ${rub(it.sell)} − ${it.cur==='USD'?usd(it.buy)+' @'+F.format(it.rate):rub(it.buy)}</div></div>
  <div class="pr">${u<0?'−':''}${rub(Math.abs(u))}<div>${it.sell?F.format((it.sell-b)/it.sell*100):0}%</div></div><button class="del" title="Удалить">×</button>`;
  d.querySelector('.chk').onchange=e=>{it.on=e.target.checked;d.classList.toggle('off',!it.on);totals();save()};
  d.querySelector('.nm').onclick=()=>load(it);
  d.querySelector('.del').onclick=()=>{d.classList.add('out');setTimeout(()=>{items=items.filter(x=>x!==it);render();save()},280)};
  L.appendChild(d)});
 totals()}
function totals(){let s=0,b=0,us=0;const on=items.filter(i=>i.on);
 on.forEach(i=>{s+=i.sell*i.qty;const bb=i.cur==='USD'?i.buy*i.rate:i.buy;b+=bb*i.qty;if(i.cur==='USD')us+=i.buy*i.qty});
 tween($('tProfit'),s-b,rub);tween($('tSell'),s,rub);tween($('tBuy'),b,rub);tween($('tUsd'),us,usd);
 $('tMargin').textContent=s?F.format((s-b)/s*100)+'%':'0%';
 $('cnt').textContent=items.length?`выбрано ${on.length} из ${items.length}`:'';return{s,b,on}}
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(it){editId=it.id;$('name').value=it.name;$('sell').value=it.sell;$('buy').value=it.buy;$('qty').value=it.qty;
 if(it.cur==='USD')$('rate').value=it.rate;setCur(it.cur);$('add').textContent='Сохранить';$('sell').focus()}
function clearForm(){['name','sell','buy','qty'].forEach(i=>$(i).value='');editId=null;$('add').textContent='Добавить';calc();$('name').focus()}
$('add').onclick=()=>{const c=current();if(!c.s&&!c.bRaw){toast('Введите цены');return}
 if(cur==='USD'&&!c.rate){toast('Укажите курс доллара');$('rate').focus();return}
 const data={name:$('name').value.trim(),sell:c.s,buy:c.bRaw,cur,rate:c.rate,qty:c.q,on:true};
 if(editId){Object.assign(items.find(i=>i.id===editId),data);toast('Сохранено')}else{items.push({id:Date.now(),...data});toast('Добавлено')}
 render();clearForm();save()};
$('reset').onclick=clearForm;
$('clear').onclick=()=>{if(items.length&&confirm('Очистить весь список?')){items=[];render();save()}};
$('copy').onclick=()=>{const t=totals();if(!t.on.length){toast('Список пуст');return}
 const lines=t.on.map(i=>{const b=i.cur==='USD'?i.buy*i.rate:i.buy;return`${i.name||'Без названия'} — ${i.qty} шт: ${rub((i.sell-b)*i.qty)}`});
 lines.push('',`Выручка: ${rub(t.s)}`,`Закуп: ${rub(t.b)}`,`Прибыль: ${rub(t.s-t.b)}`);
 navigator.clipboard.writeText(lines.join('\n')).then(()=>toast('Скопировано'),()=>toast('Не удалось скопировать'))};
$('cbr').onclick=async()=>{$('cbr').textContent='…';try{const r=await fetch('https://www.cbr-xml-daily.ru/daily_json.js');const j=await r.json();
 $('rate').value=String(j.Valute.USD.Value.toFixed(2)).replace('.',',');calc();toast('Курс ЦБ: '+F.format(j.Valute.USD.Value)+' ₽')}
 catch(e){toast('Нет связи — введите курс вручную')}$('cbr').textContent='Курс ЦБ'};
document.querySelectorAll('#cur button').forEach(b=>b.onclick=()=>setCur(b.dataset.c));
const order=['name','sell','buy','qty'];
['rate',...order].forEach(id=>{const el=$(id);el.addEventListener('input',()=>{if(id!=='name')el.value=el.value.replace(/[^\d.,\s]/g,'');calc()});
 el.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const n=order[order.indexOf(id)+1];n?$(n).focus():$('add').click()})});
setCur(cur);render();

/* ===== ИИ (Groq) ===== */
const K=JSON.parse(localStorage.getItem('calcAI')||'{}');$('key').value=K.key||'';if(K.model&&[...$('model').options].some(o=>o.value===K.model))$('model').value=K.model;
const saveKey=()=>{localStorage.setItem('calcAI',JSON.stringify({key:$('key').value.trim(),model:$('model').value}));$('keyrow').classList.remove('on');msg('Ключ сохранён в этом браузере')};
$('keyBtn').onclick=()=>{$('keyrow').classList.toggle('on');$('key').focus()};$('keySave').onclick=saveKey;
$('key').addEventListener('keydown',e=>{if(e.key==='Enter')saveKey()});
const msg=t=>$('msg').textContent=t;
const P=$('prompt');const grow=()=>{P.style.height='auto';P.style.height=P.scrollHeight+'px'};P.addEventListener('input',grow);
P.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});
$('send').onclick=ask;document.querySelectorAll('.hint').forEach(b=>b.onclick=()=>{P.value=b.textContent;grow();P.focus()});
const SYS=`Ты парсер для калькулятора окупаемости. Пользователь пишет по-русски свободным текстом о закупках и продажах. Верни ТОЛЬКО JSON:
{"rate":число|null,"add":[{"name":строка,"sell":число,"buy":число,"cur":"USD"|"RUB","qty":число}],"update":[{"match":строка,"sell"?:число,"buy"?:число,"cur"?:"USD"|"RUB","qty"?:число,"name"?:строка}],"remove":[строка],"clear":boolean,"reply":строка}
Правила:
- sell — цена продажи ЗА 1 ШТУКУ в рублях. buy — цена закупа ЗА 1 ШТУКУ в валюте cur.
- Если указана общая сумма за партию ("купил 10 шт за 200$"), раздели на количество.
- $, долл, бакс, usd → cur "USD". руб, ₽, р, "к" (тысяч: 3к = 3000) → RUB. Если валюта закупа не указана, считай USD, если сумма похожа на доллары (маленькая относительно продажи), иначе RUB.
- Продажа всегда в рублях; если продажа названа в $, переведи по курсу (rate из текста или текущий).
- qty по умолчанию 1. name — короткое название товара с заглавной буквы.
- "курс 95" → rate 95.
- update/remove: match — название существующего товара из списка (бери точное название из списка).
- clear true только если явно просят очистить всё.
- reply — короткое подтверждение по-русски, что сделано (до 15 слов).
- Если не хватает цены продажи — ставь sell 0 и упомяни в reply.`;
async function ask(){const text=P.value.trim();if(!text)return;
 const key=($('key').value||'').trim();if(!key){$('keyrow').classList.add('on');$('key').focus();msg('Вставьте ключ Groq (console.groq.com/keys)');return}
 $('ai').classList.add('busy');$('send').disabled=true;msg('Обрабатываю…');
 const ctx=`Текущий курс: ${num($('rate'))||'не задан'}. Список товаров: ${items.map(i=>`"${i.name||'Без названия'}" (продажа ${i.sell}₽, закуп ${i.buy}${i.cur==='USD'?'$':'₽'}, ${i.qty} шт)`).join('; ')||'пусто'}.`;
 try{const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
  body:JSON.stringify({model:$('model').value,temperature:0,response_format:{type:'json_object'},messages:[{role:'system',content:SYS},{role:'system',content:ctx},{role:'user',content:text}]})});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(r.status===401?'Неверный ключ Groq':(e.error&&e.error.message)||('Ошибка '+r.status))}
  const j=await r.json();apply(JSON.parse(j.choices[0].message.content));P.value='';grow()}
 catch(e){msg(e.message==='Failed to fetch'?'Нет связи с Groq':e.message)}
 finally{$('ai').classList.remove('busy');$('send').disabled=false;P.focus()}}
const n=v=>{v=parseFloat(String(v).replace(',','.'));return isFinite(v)&&v>=0?v:0};
const find=m=>{m=String(m||'').toLowerCase();return items.find(i=>(i.name||'').toLowerCase()===m)||items.find(i=>(i.name||'').toLowerCase().includes(m)||m.includes((i.name||'').toLowerCase()))};
function apply(d){const fresh=[];
 if(d.rate&&n(d.rate)){$('rate').value=String(n(d.rate)).replace('.',',');calc()}
 const rate=num($('rate'));
 if(d.clear)items=[];
 (d.remove||[]).forEach(m=>{const it=find(m);if(it)items=items.filter(x=>x!==it)});
 (d.update||[]).forEach(u=>{const it=find(u.match);if(!it)return;['sell','buy','qty'].forEach(k=>{if(u[k]!=null)it[k]=n(u[k])});
  if(u.cur)it.cur=u.cur==='RUB'?'RUB':'USD';if(u.name)it.name=String(u.name);if(it.cur==='USD'&&!it.rate)it.rate=rate;fresh.push(it.id)});
 (d.add||[]).forEach((a,k)=>{const cur=a.cur==='RUB'?'RUB':'USD',id=Date.now()+k;
  items.push({id,name:String(a.name||''),sell:n(a.sell),buy:n(a.buy),cur,rate,qty:n(a.qty)||1,on:true});fresh.push(id)});
 render();fresh.forEach(id=>{const i=items.findIndex(x=>x.id===id);const el=$('list').children[i];if(el)el.classList.add('new')});save();
 const noRate=(d.add||[]).some(a=>a.cur!=='RUB')&&!rate;
 msg((d.reply||'Готово')+(noRate?' · Укажите курс $, иначе закуп = 0':''))}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){const rec=new SR();rec.lang='ru-RU';rec.interimResults=true;$('mic').hidden=false;let on=false;
 rec.onresult=e=>{P.value=[...e.results].map(r=>r[0].transcript).join('');grow()};
 rec.onend=()=>{on=false;$('mic').classList.remove('on');if(P.value.trim())ask()};
 $('mic').onclick=()=>{if(on){rec.stop();return}on=true;$('mic').classList.add('on');P.value='';rec.start()}}
</script></body></html>
